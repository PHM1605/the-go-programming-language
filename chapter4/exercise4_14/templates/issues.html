<!DOCTYPE html>
<html>
    <body>
        <h1>{{.TotalCount}}</h1>
        <p>
            <a href="/users">Users</a>
            <a href="/milestones">Milestones</a>
        </p>
        <table border="1">
            <tr>
                <th>#</th>
                <th>State</th>
                <th>User</th>
                <th>Title</th>
            </tr>
            {{range .Items}}
            <tr>
                <td>{{.Number}}</td>
                <td>{{.State}}</td>
                <td><a href="/user/{{.User.Login}}">{{.User.Login}}</a></td>
                <td><a href="{{.HTMLURL}}">{{.Title}}</a></td>
            </tr>
            {{end}}
        </table>
    </body>
</html>
